<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBFAF6">
<title>检索 · 日本史读本</title>
<link rel="stylesheet" href="assets/css/base.css">
</head>
<body>
<div id="site-header"></div>

<main class="wrap wrap--narrow" style="max-width:860px">
  <header class="page-head" style="border-bottom:0;padding-bottom:0">
    <span class="kicker">Search</span>
    <h1>全站检索</h1>
    <p>检索范围限于已完成章节的正文，包含人物、事件、地名与制度术语。可用空格分隔多个关键词，结果取交集。</p>
  </header>

  <div class="searchbox">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg>
    <input id="q" type="search" placeholder="例如：摄关、白村江、平清盛" autocomplete="off" spellcheck="false">
  </div>
  <div class="search-hint" id="hint">正在建立索引……</div>
  <div class="search-results" id="results"></div>
</main>

<div id="site-footer"></div>

<script src="assets/js/core.js"></script>
<script src="data/site.js"></script>
<script src="assets/js/search.js"></script>
</body>
</html>
