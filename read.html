<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBFAF6">
<title>阅读 · 日本史读本</title>
<link rel="stylesheet" href="assets/css/base.css">
</head>
<body>
<div class="progressbar" id="pb"></div>
<div id="site-header"></div>

<main class="reader">
  <aside class="rail" id="rail" aria-label="章节目录"></aside>

  <article class="article" id="article">
    <div class="article__head" id="artHead" hidden></div>
    <div class="prose" id="artBody"></div>
    <nav class="chapter-nav" id="chNav"></nav>
    <div class="related" id="related" hidden></div>
  </article>

  <aside class="tools" id="tools" aria-label="阅读设置"></aside>
</main>

<div class="floaty" id="floaty">
  <button type="button" data-act="toc">
    <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span>目录</span>
  </button>
  <button type="button" data-act="font">
    <svg viewBox="0 0 24 24"><path d="M5 19l6-14 6 14M8 14h8"/></svg><span>字号</span>
  </button>
  <button type="button" data-act="mark">
    <svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg><span>收藏</span>
  </button>
  <button type="button" data-act="top">
    <svg viewBox="0 0 24 24"><path d="M12 20V5M6 11l6-6 6 6"/></svg><span>顶部</span>
  </button>
</div>

<div class="drawer" id="drawer">
  <div class="drawer__scrim" data-act="close"></div>
  <div class="drawer__panel">
    <div class="drawer__head">
      <span class="drawer__title">目录与设置</span>
      <button class="drawer__close" type="button" data-act="close">关闭</button>
    </div>
    <div id="drawerTools"></div>
    <div id="drawerRail" style="margin-top:26px"></div>
  </div>
</div>

<div id="site-footer"></div>

<script src="assets/js/core.js"></script>
<script src="data/site.js"></script>
<script src="data/people.js"></script>
<script src="data/events.js"></script>
<script src="assets/js/read.js"></script>
</body>
</html>
